name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: python -m unittest discover -s tests -v
      - name: Validate and package Skill One
        run: |
          python -m py_compile products/skill-one/skill-one/scripts/docx_brain.py products/skill-one/skill-one/scripts/visual_gate.py scripts/generate_readme_examples.py
          python products/skill-one/package_skill.py --output "$RUNNER_TEMP/skill-one.zip"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Rebuild WebAssembly core from source
        run: |
          cargo build --release --package md2docx-core --lib --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          wasm-bindgen --target no-modules --out-dir products/chrome-extension/core --out-name md2docx_core target/wasm32-unknown-unknown/release/md2docx_core.wasm
          # Native custom metadata can differ between Windows and Linux builds.
          # The generated interface must remain stable; the next step executes
          # the rebuilt WASM through the complete browser conformance suite.
          git diff --exit-code -- products/chrome-extension/core/md2docx_core.js
      - name: Run browser, worker, capture, and WASM conformance tests
        run: node --test tests/test_*.js
      - name: Validate browser and add-in scripts
        run: |
          node --check products/chrome-extension/background.js
          node --check products/chrome-extension/md2docx.js
          node --check products/chrome-extension/popup.js
          node --check products/chrome-extension/content/github.js
          node --check products/chrome-extension/content/hackmd.js
          node --check products/chrome-extension/content/llm-capture.js
          node --check products/chrome-extension/core/md2docx_core.js
          node --check products/word-addin/taskpane.js
          python -c "import json; json.load(open('products/chrome-extension/manifest.json'))"
          python -c "import xml.etree.ElementTree as E; E.parse('products/word-addin/manifest.xml')"
      - name: Block credential literals
        run: |
          python scripts/check_credentials.py
          python scripts/check_repository.py
      - name: Verify Skill One in clean Python container
        run: |
          docker build -f products/skill-one/Dockerfile.test --tag skill-one:${{ github.sha }} .
          docker run --rm skill-one:${{ github.sha }}

  windows-release-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build and package Windows/browser products
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Verify release bundle contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @(
            "chrome-extension.zip",
            "clipboard-helper-windows-x64.zip",
            "skill-one.zip",
            "word-addin-host.zip",
            "SHA256SUMS.txt"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path "dist/releases" $name))) {
              throw "Missing release artifact: $name"
            }
          }
          $requiredEntries = @{
            "chrome-extension.zip" = "manifest.json"
            "clipboard-helper-windows-x64.zip" = "md2docx-core.exe"
            "skill-one.zip" = "skill-one/SKILL.md"
            "word-addin-host.zip" = "manifest.xml"
          }
          foreach ($archiveName in $requiredEntries.Keys) {
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path (Join-Path "dist/releases" $archiveName)))
            try {
              if ($requiredEntries[$archiveName] -notin $archive.Entries.FullName) {
                throw "$archiveName is missing $($requiredEntries[$archiveName])"
              }
            } finally {
              $archive.Dispose()
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-candidates-${{ github.sha }}
          path: dist/releases/
          retention-days: 7

  publish-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test-and-audit
      - windows-release-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-candidates-${{ github.sha }}
          path: release
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi

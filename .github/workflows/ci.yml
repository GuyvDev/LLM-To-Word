name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r api/requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - name: Validate browser and add-in scripts
        run: |
          node --check web/app.js
          node --check extension/config.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/content/github.js
          node --check extension/content/hackmd.js
          node --check office-addin/taskpane.js
          python -c "import json; json.load(open('extension/manifest.json'))"
          python -c "import xml.etree.ElementTree as E; E.parse('office-addin/manifest.xml')"
      - run: pip-audit --strict
      - name: Block credential literals
        run: |
          ! git grep -n -I -E 'sk_(live|test)_[A-Za-z0-9_-]+|whsec_[A-Za-z0-9_-]+|ghp_[A-Za-z0-9_-]+|-----BEGIN.*PRIVATE KEY-----'
      - run: docker build --tag md2docx:${{ github.sha }} .

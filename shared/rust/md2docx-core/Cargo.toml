[package]
name = "md2docx-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Canonical Markdown to Word compiler for native and WebAssembly targets"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "md2docx-core-cli"
path = "src/bin/md2docx-core.rs"

[dependencies]
comrak = { version = "0.54.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.114"

[dev-dependencies]
quick-xml = "0.39"

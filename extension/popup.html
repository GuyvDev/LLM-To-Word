<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>md2docx</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
      width: 320px;
      min-height: 200px;
    }

    header {
      background: #1e40af;
      color: #fff;
      padding: 14px 16px 10px;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    header p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .quota-box {
      background: #f0f4ff;
      border-left: 4px solid #1e40af;
      margin: 14px 16px 0;
      padding: 10px 12px;
      border-radius: 4px;
    }
    .quota-box .label { font-size: 11px; text-transform: uppercase;
                        letter-spacing: 0.6px; color: #555; }
    .quota-bar-wrap   { background: #dde5ff; border-radius: 99px;
                        height: 6px; margin: 6px 0 4px; overflow: hidden; }
    .quota-bar        { height: 100%; background: #1e40af;
                        border-radius: 99px; transition: width 0.4s; }
    .quota-text       { font-size: 12px; color: #333; }
    .quota-text strong { color: #1e40af; }

    .tier-badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 7px;
      border-radius: 99px;
      background: #dde5ff;
      color: #1e40af;
    }
    .tier-badge.pro  { background: #d1fae5; color: #065f46; }
    .tier-badge.team { background: #fef3c7; color: #92400e; }

    .convert-section { padding: 14px 16px; }
    .convert-section label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #555; display: block; margin-bottom: 5px;
    }
    textarea {
      width: 100%; height: 90px; resize: vertical;
      border: 1px solid #d1d5db; border-radius: 6px;
      padding: 8px; font-size: 12px; font-family: "JetBrains Mono",
      "Fira Code", monospace; outline: none;
    }
    textarea:focus { border-color: #1e40af; box-shadow: 0 0 0 2px #bfdbfe; }

    .btn {
      display: block; width: 100%; margin-top: 10px;
      padding: 9px 0; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary  { background: #1e40af; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1e3a8a; }
    .btn-upgrade  { background: #f59e0b; color: #fff; margin-top: 6px; }
    .btn-upgrade:hover { background: #d97706; }

    .status {
      font-size: 12px; margin-top: 8px; min-height: 18px;
      text-align: center; color: #6b7280;
    }
    .status.error   { color: #dc2626; }
    .status.success { color: #059669; }

    footer {
      padding: 8px 16px 12px;
      font-size: 10px; color: #9ca3af;
      border-top: 1px solid #f3f4f6;
    }
    footer a { color: #1e40af; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>md2docx</h1>
  <p>Markdown · Hebrew RTL · LaTeX math → Word .docx</p>
</header>

<div class="quota-box">
  <div class="label">Monthly conversions</div>
  <div class="quota-bar-wrap"><div class="quota-bar" id="quotaBar" style="width:0%"></div></div>
  <div class="quota-text" id="quotaText">Loading…</div>
  <span class="tier-badge" id="tierBadge">free</span>
</div>

<div class="convert-section">
  <label for="mdInput">Paste Markdown (or use the button on GitHub/HackMD)</label>
  <textarea id="mdInput" placeholder="# Hello&#10;Write your **Markdown** here…&#10;$$E = mc^2$$"></textarea>
  <button class="btn btn-primary" id="convertBtn">⬇ Download .docx</button>
  <button class="btn btn-upgrade" id="upgradeBtn" style="display:none">
    🚀 Upgrade to Pro — $5/mo
  </button>
  <div class="status" id="status"></div>
</div>

<footer>
  <a href="https://md2docx.app" target="_blank">md2docx.app</a> ·
  <a href="https://md2docx.app/#upgrade" target="_blank" id="footerUpgrade">Upgrade</a> ·
  <a href="https://github.com/your-org/md2docx" target="_blank">GitHub</a>
</footer>

<script src="popup.js"></script>
</body>
</html>
